version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: poly_enspd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poly_user
      POSTGRES_PASSWORD: poly_secure_password_2026
      POSTGRES_DB: poly_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poly_user -d poly_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - poly_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poly_enspd_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poly_user:poly_secure_password_2026@db:5432/poly_db
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-haiku-20240307}
      SIMILARITY_THRESHOLD: "0.45"
      SECRET_KEY: ${SECRET_KEY:-poly-enspd-secret-key-2026-douala-rag-secure}
    networks:
      - poly_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poly_enspd_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - poly_network

  nginx:
    image: nginx:alpine
    container_name: poly_enspd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - poly_network

volumes:
  postgres_data:
    driver: local

networks:
  poly_network:
    driver: bridge

